<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Luxayor Showroom</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#160504;--deep:#230B09;--gold:#C4976A;--light:#D4A878;--ivory:#F5EDE0;--cream:#E8D8C4;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Outfit',Helvetica,Arial,sans-serif}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;cursor:none;color:var(--ivory)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;overflow:hidden}
.slide.on{opacity:1}
.bgl{position:absolute;inset:-3%;background-size:cover;background-position:center;transform:scale(1.02)}
.on .bgl{animation:drift 18s ease-out forwards}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.row{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.grp .row{padding-bottom:5vh;box-sizing:border-box}
.row img{display:block;flex:none;box-shadow:0 1.2vw 3.5vw rgba(0,0,0,.5)}
.on .row img{animation:rise 1.5s cubic-bezier(.2,.7,.2,1) both}
.on .row img:nth-child(2){animation-delay:.25s}.on .row img:nth-child(3){animation-delay:.5s}
@keyframes rise{from{opacity:0;transform:translateY(2vh) scale(.985)}to{opacity:1;transform:none}}
.slide.cov .bgl{display:none}
.slide.cov .row img{width:100%;height:100%;object-fit:cover;box-shadow:none}
.slide.cov.on .row img{animation:kb 16s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.brandL{position:fixed;left:0;right:0;bottom:0;padding:5vw 3vw 2vw;background:linear-gradient(to top,rgba(22,5,4,.6),transparent);display:flex;align-items:center;gap:1.8vw;transition:opacity 1s;z-index:5;pointer-events:none}
.brandL img{height:2.4vw;display:block}
.brandL span{font:300 .75vw var(--sans);letter-spacing:.35em;text-transform:uppercase;color:var(--light)}
.brandL.off{opacity:0}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 45%,var(--deep),var(--bg) 70%)}
.card h2{font:300 3.6vw/1.2 var(--serif);letter-spacing:.04em;margin:0;max-width:70vw;color:var(--ivory)}
.rule{width:9vw;height:1px;background:var(--gold);margin:2.6vw 0}
.card p{font:300 1.15vw var(--sans);letter-spacing:.5em;text-transform:uppercase;color:var(--gold);margin:0 0 0 .5em}
.biglogo{width:34vw;display:block}.biglogo.sm{width:14vw;margin-top:3vw}
.on .card-in>*{animation:fade 2s ease both}.on .card-in>*:nth-child(2){animation-delay:.4s}.on .card-in>*:nth-child(3){animation-delay:.8s}
@keyframes fade{from{opacity:0;transform:translateY(1.2vw)}to{opacity:1;transform:none}}
.brand{position:fixed;left:0;right:0;bottom:2.2vh;display:flex;justify-content:center;transition:opacity 1s;z-index:5;pointer-events:none}
.brand img{height:1.9vw;display:block;opacity:.9}
.brand.off{opacity:0}
#hint{position:fixed;top:1.5vw;right:2vw;font:300 .9vw var(--sans);letter-spacing:.2em;color:var(--cream);opacity:.8;transition:opacity 2s;z-index:9}
</style></head><body>
<div id="stage"></div>
<div class="brand off" id="brand"><img class="lg" alt="Luxayor"></div>
<div class="brandL off" id="brandL"><img class="lg" alt="Luxayor"><span>Furniture &middot; Doors &middot; Joinery</span></div>
